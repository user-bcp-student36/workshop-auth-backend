quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${auth.cors.origins}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.db.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
auth.db.migrate-plaintext=${AUTH_DB_MIGRATE_PLAINTEXT:false}
auth.seed.student-hash=${AUTH_STUDENT_PASSWORD_HASH}
auth.seed.trainer-hash=${AUTH_TRAINER_PASSWORD_HASH}
auth.password.iterations=${AUTH_PASSWORD_ITERATIONS:600000}
auth.token.secret=${AUTH_TOKEN_SECRET}
auth.cors.origins=${AUTH_CORS_ORIGINS}
